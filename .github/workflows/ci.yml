name: WorkFlowHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-workflowhub-github-actions-secret-key-2026' }}
  DJANGO_DEBUG: "True"
  REACT_APP_API_URL: "http://localhost:8000/api"

jobs:
  backend-ci:
    name: Backend Lint, Test & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Code Quality & Linting
        working-directory: ./backend
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: |
          python manage.py test --noinput

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: workflowhub-backend:${{ github.sha }}, workflowhub-backend:latest
          build-args: |
            PORT=8000

  frontend-ci:
    name: Frontend Test & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: |
          npm test -- --watchAll=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: workflowhub-frontend:${{ github.sha }}, workflowhub-frontend:latest
          build-args: |
            REACT_APP_API_URL=http://localhost:8000/api

  docker-compose-validation:
    name: Validate Multi-Container Stack
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker Compose file is valid and ready for multi-container orchestration."
