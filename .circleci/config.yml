version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
        environment:
          DJANGO_SECRET_KEY: circleci-workflowhub-secret-test-key-2026
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  node-executor:
    docker:
      - image: cimg/node:20.11
        environment:
          REACT_APP_API_URL: http://localhost:8000/api
          CI: "true"

jobs:
  backend-job:
    executor: python-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-backend-deps-{{ checksum "backend/requirements.txt" }}
            - v1-backend-deps-
      - run:
          name: Install Python Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r backend/requirements.txt
      - save_cache:
          paths:
            - ./venv
          key: v1-backend-deps-{{ checksum "backend/requirements.txt" }}
      - run:
          name: Run Django Unit Tests
          command: |
            . venv/bin/activate
            cd backend
            python manage.py test --noinput
      - setup_remote_docker:
          version: default
      - run:
          name: Build Backend Docker Image
          command: |
            docker build -t workflowhub-backend:${CIRCLE_SHA1} ./backend

  frontend-job:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-frontend-deps-{{ checksum "frontend/package.json" }}
            - v1-frontend-deps-
      - run:
          name: Install Node Dependencies
          command: |
            cd frontend
            npm install
      - save_cache:
          paths:
            - ./frontend/node_modules
          key: v1-frontend-deps-{{ checksum "frontend/package.json" }}
      - run:
          name: Run React Unit Tests
          command: |
            cd frontend
            npm test -- --watchAll=false
      - setup_remote_docker:
          version: default
      - run:
          name: Build Frontend Docker Image
          command: |
            docker build --build-arg REACT_APP_API_URL=http://localhost:8000/api -t workflowhub-frontend:${CIRCLE_SHA1} ./frontend

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - backend-job
      - frontend-job
